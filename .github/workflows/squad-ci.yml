name: Squad CI

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          for script in agents/base/*.sh agents/runner/*.sh; do bash -n "$script"; done
          python -m unittest discover -s tests -p 'test_*.py' -v

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read exact rejected source for credential-free red proof
        run: |
          git fetch --depth=1 origin 030cbf6a6cc65194a2d4dea8b965ffd6c2f6dd53
          git show 030cbf6a6cc65194a2d4dea8b965ffd6c2f6dd53:agents/base/runtime-contract.sh \
            > tests/.revision03-baseline-contract.sh
      - name: Build the shared base, worker and poller runtime without credentials
        run: |
          docker build --tag squad-worker:ci --tag squad-poller:ci \
            --build-arg GO_BASE_IMAGE=docker.io/library/golang:1.23.4-bookworm \
            --build-arg DEBIAN_BASE_IMAGE=docker.io/library/debian:bookworm-20240701-slim \
            agents/base
      - name: Verify actual runtime tooling and entrypoints
        run: |
          docker run --rm --entrypoint bash squad-worker:ci -c '
            set -euo pipefail
            copilot --no-auto-update --version
            copilot --help | grep -- --secret-env-vars >/dev/null
            install -d -o 10001 -g 10001 -m 0700 /workspace/version-home
            setpriv --reuid=10001 --regid=10001 --clear-groups --no-new-privs \
              --inh-caps=-all --ambient-caps=-all --bounding-set=-all \
              env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/workspace/version-home \
                TMPDIR=/workspace/version-home \
                /usr/local/bin/copilot --no-auto-update --version
            az version >/dev/null
            gh --version >/dev/null
            python3 -c "from pathlib import Path; compile(Path(\"/readme-publication.py\").read_bytes(), \"/readme-publication.py\", \"exec\")"
            for script in /entrypoint.sh /poller-entrypoint.sh /github-app.sh /runtime-contract.sh /model-profile.sh; do bash -n "$script"; done
          '
          docker run --rm --entrypoint /poller-entrypoint.sh \
            --env SQUAD_TARGET_REPO=synthetic/fixture \
            --env SQUAD_POLL_ISSUE_NUMBER=7 --env SQUAD_POLL_AGENT=ripley \
            --env SQUAD_POLL_STOP_AFTER_UTC=2000-01-01T00:00:00Z \
            --env AZURE_STORAGE_ACCOUNT=syntheticstorage --env QUEUE_NAME=synthetic-queue \
            --env AZURE_CLIENT_ID=synthetic-mi --env GITHUB_APP_ID=123 \
            --env GITHUB_APP_INSTALLATION_ID=456 --env KEY_VAULT_NAME=synthetic-vault \
            --env KEY_VAULT_SECRET_NAME=synthetic-key squad-poller:ci
          set +e
          docker run --rm squad-worker:ci
          status=$?
          set -e
          test "$status" -eq 1
      - name: Prove real Linux root/model boundary and trusted publication
        run: |
          docker run --rm --volume "$PWD:/ci:ro" --entrypoint /usr/bin/python3 \
            squad-worker:ci -I /ci/tests/container-uid-smoke.py
